<!DOCTYPE html>
<html data-theme="performance" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Catalouge</title>
    <link rel="stylesheet" href="./dist/output.css">
</head>
<body>
    <nav class="p-5 flex flex-wrap items-center gap-3">
        <div class="flex-1 flex items-center gap-2">
            <img src="./assets/computer-logo.svg" class="h-8 w-8" alt="logo">
            <p class="text-accent font-bold">LaptopFinder</p>
        </div>
        <!-- links: always visible from md up; on phones hidden until the menu button is pressed -->
        <div id="nav-links" class="max-md:hidden order-last w-full flex flex-col gap-3 md:order-none md:w-auto md:flex-row md:gap-5 px-3">
            <a href="./index.html" class="btn-ghost">Home</a>
            <a href="./laptops.html" class="btn-ghost">Laptops Catalogue</a>
            <a href="./favourites.html" class="btn-ghost">Favourites</a>
            <a href="./compare.html" class="btn-ghost">Compare</a>
        </div>
        <div class="flex items-center gap-2 md:flex-1 justify-end">
            <button id="theme-toggle" class="btn-action text-sm sm:text-base"></button>
            <button id="menu-toggle" class="btn-action md:hidden" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links">&#9776;</button>
        </div>
    </nav>

    <section>
        <div class="flex flex-row justify-center p-4 max-sm:justify-start ">
            <img src="./assets/search-performance.svg" alt="fav" class="h-4 w-4 block [html[data-theme='battery']_&]:hidden  relative right-1.5 top-2.5  " >
            <img src="./assets/search-battery.svg" alt="fav" class="h-4 w-4 hidden [html[data-theme='battery']_&]:block  relative right-1.5 top-2.5 ">
            <input id="search" type="text" placeholder="Search by name or brand" class="filter-input max-w-sm md:justify-start sm:justify-start ">
        </div>
        <div class="flex flex-row flex-wrap justify-start gap-2.5 px-4 py-1.5">
            <div>
            <select class="filter-input w-max  " id="category">
                <option value="">All Categories</option>
                <option value="ultrabook">ultrabook</option>
                <option value="gaming">gaming</option>
                <option value="2-in-1">2-in-1</option>
                <option value="creator">creator</option>
                <option value="budget">budget</option>
            </select>
        </div>
        <div>
            <select class="filter-input w-max" id="sort-filter">
                <option value="price-asc">Price(lowest to highest)</option>
                <option value="price-dsc">Price(highest to lowest)</option>
                <option value="RAM-asc">RAMs(lowest to highest)</option>
                <option value="RAM-dsc">RAMs(highest to lowest)</option>
                <option value="weight-asc">Weight(lowest to highest)</option>
                <option value="weight-dsc">Weight(highest to lowest)</option>
            </select>
        </div>
        </div>
        <div class="result-count "></div>
    </section>

    <section class="catalogue-grid "  id="catalouge"></section>
    <div id="toast" class="toast"></div>
    <script type="module" src="./src/js/laptops.js"></script>
    <script type="module" src="./src/js/theme.js"></script>
</body>
</html>
